name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan for credentials
        run: >
          npx --yes
          -p secretlint
          -p @secretlint/secretlint-rule-preset-recommend
          -p @secretlint/secretlint-rule-pattern
          secretlint --format github "**/*"
